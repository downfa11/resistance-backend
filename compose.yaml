services:
  resistance-server:
    build: .
    environment:
      RESISTANCE_ENV: development
      RESISTANCE_ADDR: :8080
      RESISTANCE_DB_PATH: /data/app.db
      RESISTANCE_ASSET_ROOT: /data/assets
      RESISTANCE_JWT_SECRET: local-resistance-secret-change-me
      RESISTANCE_ALLOWED_ORIGINS: http://localhost:3000
      RESISTANCE_BOOTSTRAP_ADMIN_ACCOUNT: ${RESISTANCE_BOOTSTRAP_ADMIN_ACCOUNT:-}
      RESISTANCE_BOOTSTRAP_ADMIN_EMAIL: ${RESISTANCE_BOOTSTRAP_ADMIN_EMAIL:-}
      RESISTANCE_BOOTSTRAP_ADMIN_PASSWORD: ${RESISTANCE_BOOTSTRAP_ADMIN_PASSWORD:-}
      RESISTANCE_BOOTSTRAP_ADMIN_DISPLAY_NAME: ${RESISTANCE_BOOTSTRAP_ADMIN_DISPLAY_NAME:-Resistance Admin}
    ports:
      - "8080:8080"
    volumes:
      - resistance-data:/data
    restart: unless-stopped

volumes:
  resistance-data:
