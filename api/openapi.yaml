components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
      description: Unique command key. Reusing it with a different request returns HTTP 409.
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Envelope:
      type: object
      required: [data]
      properties:
        data:
          description: Endpoint-specific response payload.
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
    Session:
      type: object
      required: [accessToken, refreshToken, user]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        user: { $ref: '#/components/schemas/User' }
    User:
      type: object
      required: [id, account, email, displayName, role]
      properties:
        id: { type: integer, format: int64 }
        account: { type: string }
        email: { type: string, format: email }
        displayName: { type: string }
        role: { type: string, enum: [user, admin] }
    ResistanceProfile:
      type: object
      required: [userId, displayName, address, gold, highScore, energy, scenario, head, body, arm, health, attack, critical, durability]
      properties:
        userId: { type: integer, format: int64 }
        displayName: { type: string }
        address: { type: string }
        gold: { type: integer, format: int64 }
        highScore: { type: integer }
        energy: { type: integer }
        scenario: { type: integer, minimum: 0 }
        head: { type: integer, minimum: 0 }
        body: { type: integer, minimum: 0 }
        arm: { type: integer, minimum: 0 }
        health: { type: integer }
        attack: { type: integer }
        critical: { type: integer }
        durability: { type: integer }
    ResistanceBalance:
      type: object
      required: [code, quantity]
      properties:
        code: { type: string }
        quantity: { type: integer, format: int64 }
    ResistanceExchange:
      type: object
      required: [id, currencyCode, quantity, rate, goldGranted, balance, gold, createdAt]
      properties:
        id: { type: integer, format: int64 }
        currencyCode: { type: string }
        quantity: { type: integer, format: int64 }
        rate: { type: integer }
        goldGranted: { type: integer, format: int64 }
        balance: { type: integer, format: int64 }
        gold: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }